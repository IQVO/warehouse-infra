# exception-management -- the exception management bounded context (WES: the
# exception case ledger fed by every sibling context's failure signals, their
# triage/assignment/escalation/resolution and the SLA sweeper). OLTP REST on
# :8080 plus, in the SAME process, a transactional-outbox relay, the SLA
# sweeper and six Kafka consumers (exception-management ADR 0001):
#   - consumes warehouse.fulfillment.events, group
#     exception-management-fulfillment
#   - consumes warehouse.work-planning.events, group
#     exception-management-work-planning
#   - consumes warehouse.network-fulfillment.events, group
#     exception-management-network-fulfillment
#   - consumes warehouse.order-management.events (auto-resolve
#     correlation), group exception-management-order-correlation
#   - consumes warehouse.inventory.events, group
#     exception-management-inventory
#   - consumes warehouse.returns-processing.events, group
#     exception-management-returns
#   - produces warehouse.exception-management.events and
#     warehouse.exception-management.analytics (CloudEvents) through the
#     outbox.
# Topics are auto-created by the first writer with the broker's
# num.partitions / replication-factor-1 overrides (the fleet norm; kafka.tf
# has no topic resources), so the two topics above and the .dlq topics need
# no declaration here. A consumed topic whose producer has not written yet
# shows as consumer retry logs, not as unreadiness.
#
# Real Postgres and real Kafka only: the *_MODE variables are intentionally
# NOT set and this chart refuses one in extraEnv at render time. Every key
# below is a DEDICATED chart value (charts/exception-management/values.yaml
# renders each one to its env var), so none of this belongs in extraEnv
# (a duplicate env entry breaks ArgoCD's diff). The Kafka brokers
# (KAFKA_BROKERS) come from _platform.yaml, as for every chart.
#
# Startup: runs golang-migrate before serving, over MIGRATIONS_DATABASE_URL
# (the direct, non-pooled DSN Terraform puts in the <svc>-db Secret);
# DATABASE_URL itself goes through PgBouncer. The role/database are created
# by modules/application's provisioning Job (ADR 0005), before the first
# sync.
#
# Optional components (both switched on below):
#   - MCP server (cmd/mcp, read-only: list_open_exceptions, get_exception,
#     get_exception_policies, get_sla_report): mcp.enabled. This chart
#     renders no Kong route for it (unlike pick-face-replenishment's
#     mcp.route) -- the Service exception-management-mcp:8090 stays
#     ClusterIP and warehouse-ops-agent reaches it in-cluster.
#   - Analytics read side: exceptions-projector (the only writer of the
#     SEPARATE exception_management_analytics database, fed by
#     warehouse.exception-management.analytics) and exceptions-reports
#     (read-only, Service exception-management-reports:80 -- the chart has
#     no Kong route for reports). The DSN never appears here:
#     modules/application writes it into the exception-management-analytics-db
#     Secret (the chart reads only ANALYTICS_DATABASE_URL, apps.yaml
#     analytics.secret_keys), which analytics.existingSecret names.
#   - The console remote (exceptions_mfe, web/): frontend below; its
#     content-addressed image tag comes from Terraform (local.frontend_remotes),
#     the web gateway serves it at /mfes/exception-management/.

replicaCount: 1

config:
  httpAddr: ":8080"
  logLevel: "info"
  # OUTBOX_*: stated at the chart's own defaults so the deployment is
  # self-describing (the relay claims pending rows every 1s; a row that
  # failed 20 times is excluded so a poison row cannot block the relay).
  outboxRelayInterval: "1s"
  outboxMaxAttempts: 20
  # SLA_SWEEP_INTERVAL: how often the sweeper escalates breached open
  # cases; the chart's own default (binary default 1m), stated here so the
  # deployed cadence is visible in this repo.
  slaSweepInterval: "1m"
  # Fixed, stable group ids (the chart's own defaults, stated here so the
  # deployed names are visible in this repo): a rescheduled pod resumes from
  # its committed offsets; a brand-new group re-reads the topic from the
  # start. All six are required (the binary exits at boot without them).
  fulfillmentExceptionsConsumerGroup: "exception-management-fulfillment"
  workPlanningExceptionsConsumerGroup: "exception-management-work-planning"
  networkFulfillmentExceptionsConsumerGroup: "exception-management-network-fulfillment"
  orderCorrelationConsumerGroup: "exception-management-order-correlation"
  inventoryExceptionsConsumerGroup: "exception-management-inventory"
  returnsExceptionsConsumerGroup: "exception-management-returns"

# Analytics read side. The projector's consumer group is a FIXED, stable id
# (fleet charter naming `<ctx>-analytics`): a restarted pod resumes from its
# committed offsets, and a brand-new group rebuilds the model from the
# topic's history. Equal to the chart's default, pinned here so a rename in
# code cannot silently orphan the committed offsets. MANDATORY when enabled
# (the chart refuses an empty one).
analytics:
  enabled: true
  consumerGroup: "exception-management-analytics"
  existingSecret: exception-management-analytics-db

# Platform facts (Gateway parentRefs, Kafka brokers, OTLP endpoint, CORS origin) come from
# _platform.yaml; image tags from Terraform (the Application's valuesObject).
database:
  existingSecret: exception-management-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/exception-management-frontend
image:
  pullPolicy: IfNotPresent
  repository: warehouse/exception-management
mcp:
  enabled: true
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
