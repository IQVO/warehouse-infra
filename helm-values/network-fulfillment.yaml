# network-fulfillment: the fleet's Anti-Corruption Layer to a retail network. Complete Helm
# values (ADR 0002 D2), formerly computed in terraform/10-platform/network-fulfillment.tf (see
# its git history for each block's reasoning).

# THE MODE: config.networkMode is "live" on this cluster (ADR 0009). The service talks to the
# retail network that runs in this same cluster, through the vendor-connectivity Service (not
# Kong), as vendor V-WS; nothing leaves the cluster and the Vendor API takes no credential.
# "stub" stays the chart default and the mode of tests and of any environment without a
# network. Going back is a revert of this block (ADR 0009, decision 7). Live mode needs:
#   - the network seeded (make seed-network; the seeded node's vendorNodeCode is SITE_ID below,
#     which is how the service ADOPTS it instead of registering a second one);
#   - productTranslation below GENERATED from that network (make seed-network-translation) and
#     checked (make seed-network-translation-check): the keys are the network's listing ids and
#     change on a reseed;
#   - no stubDemand (the chart refuses it live).

# Platform facts come from _platform.yaml, the kind CPU overlay from kind-resources/, the
# image tags from Terraform. The chart reads network-fulfillment-db and
# network-fulfillment-analytics-db (existingSecret).
analytics:
  database:
    existingSecret: network-fulfillment-analytics-db
  enabled: true
  reports:
    route:
      enabled: true
      path: /api/network-fulfillment/reports
config:
  eventPublisher: kafka
  inboundReceiptConsumerGroup: network-fulfillment-inbound-receiving
  inboundReceivingUrl: http://inbound-receiving.warehouse-systems.svc.cluster.local:80
  networkBaseUrl: http://vendor-connectivity.warehouse-systems.svc.cluster.local:80
  networkMode: live
  networkVendorId: V-WS
  orderManagementUrl: http://order-management.warehouse-systems.svc.cluster.local:80
  pollInterval: 1m
  port: '8080'
  productMasterUrl: http://product-master.warehouse-systems.svc.cluster.local:80
  sweepInterval: 5m
database:
  existingSecret: network-fulfillment-db
  existingSecretKey: DATABASE_URL
extraEnv:
  - name: CAPABILITY_OFFER_ENABLED
    value: 'true'
  - name: KAFKA_BROKERS
    value: kafka.warehouse-systems.svc.cluster.local:9092
  - name: INVENTORY_STORAGE_URL
    value: http://inventory-storage.warehouse-systems.svc.cluster.local:80
  - name: SITE_ID
    value: site-1
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/network-fulfillment-frontend
gatewayApi:
  enabled: true
  hosts:
    - path: /api/network-fulfillment
      pathType: PathPrefix
  stripPath: true
image:
  pullPolicy: IfNotPresent
  repository: warehouse/network-fulfillment
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/network-fulfillment
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/network-fulfillment
productTranslation:
