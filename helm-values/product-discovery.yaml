# product-discovery -- storefront domain search and discovery. Single api
# Deployment: OLTP REST :8080 + outbox relay + three local-copy consumers
# (offer-availability, product-content, pricing). The rebuild binary is a
# one-shot backfill: an optional default-OFF Helm Job (docs/adr 0006), not a
# long-running component, so it is not enabled here. Real Postgres and real
# Kafka only; brokers/parentRefs/CORS/OTLP from _platform.yaml; image tag
# from Terraform; CPU from kind-resources/. Migrations at boot over
# MIGRATIONS_DATABASE_URL from the product-discovery-db Secret (ADR 0005).

config:
  # fixed, stable group ids (see pricing): all MANDATORY.
  offerAvailabilityConsumerGroup: "product-discovery-offer-availability"
  productContentConsumerGroup: "product-discovery-product-content"
  pricingConsumerGroup: "product-discovery-pricing"
database:
  existingSecret: product-discovery-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

gatewayApi:
  enabled: true
  hosts:
    - path: /api/product-discovery
      pathType: PathPrefix
  stripPath: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/product-discovery

service:
  port: 80
  targetPort: 8080
  type: ClusterIP
mcp:
  # Read-only L1 MCP server (cmd/mcp, the service's MCP ADR). No auth, by the fleet decision.
  # The route is /api/mcp/product-discovery; Kong rewrites it to /mcp. Requests are sized in
  # helm-values/kind-resources/product-discovery.yaml (the cluster has no spare CPU or pod slot at the chart default).
  enabled: true
  route:
    enabled: true
    path: /api/mcp/product-discovery
a2a:
  enabled: true
  # A2A inbound adapter (see the repo's A2A ADR): delegation only; facts still travel as
  # CloudEvents on Kafka. Kong rewrites the path to / so the well-known agent card
  # stays reachable under the same prefix; parentRefs come from _platform.yaml.
  route:
    enabled: true
    path: /api/a2a/product-discovery

# Capacity step 3: cmd/mcp and cmd/a2a run as the two containers of one <release>-agents
# Deployment (chart's agents.colocate). The Services -mcp/-a2a keep their names and ports but
# select the agents pod; the standalone Deployments are pruned (PruneLast) after it serves.
agents:
  colocate: true
# Kong plugins (cors, prometheus, opentelemetry) rendered by the chart's kong-plugins.yaml and attached to
# every route by annotation (fleet decision 2026-10-13). The CORS origin and the OTLP endpoint come from
# _platform.yaml.
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
