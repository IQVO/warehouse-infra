# process-path-management — Process Path Management bounded context.
#
# New service (added 2026-09-06): the fleet's process-path catalogue as a
# real bounded context (Generic Subdomain, same classification as
# facility-layout), replacing the static config/process-paths/sortable-fc.yaml
# file this repo's three consumers (fulfillment-execution, wes-work-planning,
# workforce-management) previously boot-loaded directly (cutover 2026-09-06:
# they now read PATH_CATALOGUE_SOURCE=kafka; the rollback is in
# docs/rollback-switches.md).
#
# Kafka: publishes the catalogue events (config.eventPublisher "kafka"); the
# broker address comes from _platform.yaml.
#
# This service has NO inbound Kafka consumer of its own (see its own
# README/docs) -- it is the SOURCE of the process-path published
# language, never a consumer, so there is no consumer-group config to set
# here unlike the fleet's other Kafka-consuming services.

replicaCount: 1

config:
  httpAddr: ":8080"

  eventPublisher: kafka
kafka:
  enabled: 'true'
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 6

# Readiness on /readyz, not /healthz (gap fix D24): process-path-management's
# readiness flips to not-ready as the FIRST step of a graceful SIGTERM drain
# (its ADR-0012, cmd/pathmgmt/main.go), so the pod stops receiving new
# traffic while it finishes in-flight requests. /healthz never flips, so the
# old probe here overrode the chart's own /readyz default and hid the drain.
# failureThreshold 3 (was 6): at periodSeconds 5 that is ~15 s to observe the
# flip, inside the chart's 30 s terminationGracePeriodSeconds -- 6 x 5 s = 30 s
# meant the flip could never be observed before the kill.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 3

# Formerly computed by terraform/services.tf (ADR 0002 phase 3, docs/adr/0002-application-delivery-boundary.md).
# Platform facts (Gateway parentRefs, Kafka brokers, OTLP endpoint, CORS origin) come from
# _platform.yaml; image tags from Terraform (the Application's valuesObject).
analytics:
  database:
    existingSecret: process-path-management-analytics-db
  enabled: true
  reports:
    route:
      enabled: true
      path: /api/process-path-management/reports
database:
  existingSecret: process-path-management-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/process-path-management-frontend
gatewayApi:
  enabled: true
  hosts:
    - path: /api/process-path-management
      pathType: PathPrefix
  stripPath: true
image:
  pullPolicy: IfNotPresent
  repository: warehouse/process-path-management
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/process-path-management
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/process-path-management
a2a:
  enabled: true
  # cmd/a2a (process-path-management's A2A inbound adapter ADR): delegation only; facts still travel as
  # CloudEvents on Kafka. Kong rewrites the path to / so the well-known agent card
  # stays reachable under the same prefix; parentRefs come from _platform.yaml.
  route:
    enabled: true
    path: /api/a2a/process-path-management
pathCatalogue:
  content: ''
  enabled: false
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
