# seller-inbound -- retail-network service (a domain-driven design study, not
# associated with any company). Single api Deployment: OLTP REST on :8080 plus,
# in the SAME process, a transactional-outbox relay, three Kafka consumers and
# three loops. No analytics read side, no MCP server, no frontend remote.
#
# seller-inbound -- the seller-facing front door for stock coming into the
# network: sellers plan inbound shipments, pack cartons identified by an SSCC,
# and the shipment closes from the vendor's carton-level receipt. Publishes
# retailnetwork.seller-inbound.events; consumes node-topology events (node
# inbound limits), offer-availability packaging events (pack levels) and
# vendor-connectivity receipt events. No synchronous REST call into a sibling
# (the chart has no *Url keys).
#
# Real Postgres and real Kafka only (the chart refuses a render without a
# database source, the brokers, the three groups and the SSCC prefix); the
# service has no *_MODE switch (the chart refuses one in extraEnv). Topics are
# auto-created by the first writer (the fleet norm -- kafka.tf has no topic
# resources), BUT a kafka-go group consumer started before its topic exists is
# never handed the partition: the topic retailnetwork.seller-inbound.events is
# pre-created at deploy (kafka-topics.sh --create --if-not-exists) before any
# consumer of it starts. The brokers (KAFKA_BROKERS), the Gateway parentRefs,
# the CORS origin and the OTLP endpoint come from _platform.yaml; the image tag
# from Terraform (the Application's valuesObject); the CPU request from
# kind-resources/ (the kind overlay). Startup runs golang-migrate over
# MIGRATIONS_DATABASE_URL (the direct DSN Terraform puts in the seller-inbound-db
# Secret); DATABASE_URL goes through PgBouncer. The role and database are
# created by modules/application's provisioning Job (ADR 0005) before the first
# sync.

config:
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  # Consumes retailnetwork.node-topology.events.
  nodeConsumerGroup: "seller-inbound-node-topology"
  # Same rule. Consumes retailnetwork.offer-availability.events (packaging).
  catalogConsumerGroup: "seller-inbound-catalog-packaging"
  # Same rule. Consumes retailnetwork.vendor-connectivity.events (receipts).
  receiptConsumerGroup: "seller-inbound-vendor-receipts"
  # The network's GS1 company prefix the SSCCs it issues are built from
  # (6 to 11 digits; MANDATORY, validated at boot). LOCAL-CLUSTER-ONLY
  # FICTIONAL value: 9-digit, not a real GS1 company prefix, so it must never
  # be used outside this kind cluster.
  ssccCompanyPrefix: "999000123"

database:
  existingSecret: seller-inbound-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

# Kong exposure of the OLTP API (the chart's httproute.yaml):
# /api/seller-inbound, prefix stripped. The parentRefs come from
# helm-values/_platform.yaml (the shared warehouse-gateway), never per-app.
gatewayApi:
  enabled: true
  hosts:
    - path: /api/seller-inbound
      pathType: PathPrefix
  stripPath: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/seller-inbound

service:
  port: 80
  targetPort: 8080
  type: ClusterIP
