# last-mile-delivery -- retail-network reference service (a domain-driven design
# study, not associated with any company). Single api Deployment: OLTP
# REST on :8080 plus, in the SAME process, a transactional-outbox relay
# and the local-copy consumers below. Still no analytics read side, but
# a read-only MCP server (cmd/mcp) and a console remote (web/, last_mile_mfe)
# now exist and are switched on below.
#
# last-mile-delivery -- final-leg deliveries: consumes linehaul,
# node-topology and shipping streams, publishes
# retailnetwork.last-mile-delivery.events.
#
# Real Postgres and real Kafka only (the chart refuses a render without
# a database source and the brokers); topics are auto-created by the
# first writer (the fleet norm -- kafka.tf has no topic resources), so
# a consumed topic whose producer has not written yet shows as consumer
# retry logs, not as unreadiness. The brokers (KAFKA_BROKERS), the
# Gateway parentRefs, the CORS origin and the OTLP endpoint come from
# _platform.yaml; the image tag from Terraform (the Application's
# valuesObject); the CPU request from kind-resources/ (the kind
# overlay). Startup runs golang-migrate over MIGRATIONS_DATABASE_URL
# (the direct DSN Terraform puts in the last-mile-delivery-db Secret);
# DATABASE_URL goes through PgBouncer. The role and database are
# created by modules/application's provisioning Job (ADR 0005) before
# the first sync.

config:
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  linehaulConsumerGroup: "last-mile-delivery-linehaul"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  nodeTopologyConsumerGroup: "last-mile-delivery-node-topology"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  shippingConsumerGroup: "last-mile-delivery-shipping"

database:
  existingSecret: last-mile-delivery-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

# The console remote (last_mile_mfe, web/): its content-addressed image tag
# comes from Terraform (local.frontend_remotes); the web gateway
# serves it at /mfes/last-mile-delivery/.
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/last-mile-delivery-frontend

# Kong exposure of the OLTP API (the chart's httproute.yaml):
# /api/last-mile-delivery, prefix stripped. The parentRefs come from
# helm-values/_platform.yaml (the shared warehouse-gateway), never per-app.
gatewayApi:
  enabled: true
  hosts:
    - path: /api/last-mile-delivery
      pathType: PathPrefix
  stripPath: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/last-mile-delivery

# Read-only MCP server (cmd/mcp), Service last-mile-delivery-mcp:8090:
# Kong exposure /api/mcp/last-mile-delivery, prefix rewritten to /mcp
# (the chart's mcp-route.yaml). The route's parentRefs come from
# _platform.yaml exactly like the OLTP route above.
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/last-mile-delivery

service:
  port: 80
  targetPort: 8080
  type: ClusterIP
