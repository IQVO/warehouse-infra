# shopping-cart -- storefront domain carts. Single api Deployment: OLTP REST
# :8080 + outbox relay + three local-copy consumers (offer-availability,
# pricing, checkout); quotes delivery offers through delivery-promise over
# REST. Real Postgres and real Kafka only; brokers/parentRefs/CORS/OTLP from
# _platform.yaml; image tag from Terraform; CPU from kind-resources/.
# Migrations at boot over MIGRATIONS_DATABASE_URL from the shopping-cart-db
# Secret (ADR 0005).

config:
  # fixed, stable group ids (see pricing): all MANDATORY.
  offerAvailabilityConsumerGroup: "shopping-cart-offer-availability"
  pricingConsumerGroup: "shopping-cart-pricing"
  checkoutConsumerGroup: "shopping-cart-checkout"

# synchronous REST call into the sibling; MANDATORY.
deliveryPromise:
  url: "http://delivery-promise.warehouse-systems.svc.cluster.local:80"
database:
  existingSecret: shopping-cart-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

gatewayApi:
  enabled: true
  hosts:
    - path: /api/shopping-cart
      pathType: PathPrefix
  stripPath: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/shopping-cart

service:
  port: 80
  targetPort: 8080
  type: ClusterIP
mcp:
  # Read-only L1 MCP server (cmd/mcp, the service's MCP ADR). No auth, by the fleet decision.
  # The route is /api/mcp/shopping-cart; Kong rewrites it to /mcp. Requests are sized in
  # helm-values/kind-resources/shopping-cart.yaml (the cluster has no spare CPU or pod slot at the chart default).
  enabled: true
  route:
    enabled: true
    path: /api/mcp/shopping-cart
a2a:
  enabled: true
  # A2A inbound adapter (see the repo's A2A ADR): delegation only; facts still travel as
  # CloudEvents on Kafka. Kong rewrites the path to / so the well-known agent card
  # stays reachable under the same prefix; parentRefs come from _platform.yaml.
  route:
    enabled: true
    path: /api/a2a/shopping-cart

# Capacity step 3: cmd/mcp and cmd/a2a run as the two containers of one <release>-agents
# Deployment (chart's agents.colocate). The Services -mcp/-a2a keep their names and ports but
# select the agents pod; the standalone Deployments are pruned (PruneLast) after it serves.
agents:
  colocate: true
# Kong plugins (cors, prometheus, opentelemetry) rendered by the chart's kong-plugins.yaml and attached to
# every route by annotation (fleet decision 2026-10-13). The CORS origin and the OTLP endpoint come from
# _platform.yaml.
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
