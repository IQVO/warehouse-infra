# dock-scheduling -- the dock scheduling bounded context (WMS, yard domain:
# the door calendar of every site -- booked time windows on every dock door,
# inbound and outbound, the no-double-booking rule, door hours and closures,
# ETA-driven risk and no-shows). OLTP REST on :8080 plus, in the SAME process, a
# transactional-outbox relay and four Kafka consumers (dock-scheduling ADRs):
#   - consumes warehouse.yard-management.events (trailer arrival facts),
#     group dock-scheduling-yard
#   - consumes warehouse.facility.events (dock door layout copy), group
#     dock-scheduling-facility
#   - consumes warehouse.inbound-receiving.events (ASN copy), group
#     dock-scheduling-asn
#   - consumes warehouse.process-path-management.events (CPT cut-off times),
#     group dock-scheduling-cpt
#   - produces warehouse.dock-scheduling.events and
#     warehouse.dock-scheduling.analytics (CloudEvents) through the outbox.
#     yard-management consumes the integration topic (helm-values/yard-management.yaml).
#
# Real Postgres and real Kafka only (the chart refuses a render without a
# database source, the brokers and the four groups); the service has no *_MODE
# switch, so nothing is wired to roll back. Every key below is a DEDICATED
# chart value (charts/dock-scheduling/values.yaml renders each one to its env
# var), so none of this belongs in extraEnv (a duplicate env entry breaks
# ArgoCD's diff).
#
# Topics are auto-created by the first writer (the fleet norm -- kafka.tf has
# no topic resources), BUT a kafka-go group consumer started before its topic
# exists is never handed the partition. The api consumes the four topics above
# and the projector consumes warehouse.dock-scheduling.analytics, so before
# the first sync these are pre-created with `kafka-topics.sh --create
# --if-not-exists` (docs/kafka-topics-yard-dock.md): the two topics this
# service writes (warehouse.dock-scheduling.events and .analytics) and the
# ones it reads from the other contexts, since a producer that has not written
# yet leaves the topic missing. The .dlq topics are created on the first dead
# letter and need nothing.
#
# The brokers (KAFKA_BROKERS), the Gateway parentRefs, the CORS origin and the
# OTLP endpoint come from _platform.yaml; the image tag from Terraform (the
# Application's valuesObject); the CPU request from kind-resources/ (the
# overlay is applied on k3s too). Startup runs golang-migrate over
# MIGRATIONS_DATABASE_URL (the direct DSN Terraform puts in the
# dock-scheduling-db Secret); DATABASE_URL goes through PgBouncer. The role and
# database are created by modules/application's provisioning Job (ADR 0005)
# before the first sync.
#
# Optional components (all switched on below):
#   - MCP server (cmd/mcp, ADR 0007): mcp.enabled plus the Kong route
#     /api/mcp/dock-scheduling.
#   - Dedicated outbox relay (cmd/relay): the api already relays inline, so
#     this Deployment is redundant but safe beside it (claims are
#     FOR UPDATE SKIP LOCKED); it drains the outbox with its own probes and
#     resources. Set relay.enabled to false to drop it.
#   - Analytics read side (ADR 0006): the projector (the only writer of the
#     SEPARATE dock_scheduling_analytics database, fed by
#     warehouse.dock-scheduling.analytics) and the reports (read-only, Service
#     dock-scheduling-reports:80, HTTPRoute /api/dock-scheduling/reports ->
#     /reports). modules/application writes both DSNs
#     (ANALYTICS_DATABASE_URL and ANALYTICS_READER_DATABASE_URL, apps.yaml
#     `analytics: true`) into the dock-scheduling-analytics-db Secret, which
#     analytics.database.existingSecret names.
#   - No-show sweep CronJob (sweeps.enabled, on by default in the chart): runs
#     /app/sweep every 5 minutes against the in-cluster api Service
#     (http://dock-scheduling:80/no-show-sweeps, derived by the chart from the
#     release name and service.port), so no URL is set here.
#   - No A2A component: the chart has none, so there is no a2a block.
#   - No web part: no frontend remote, no frontend block.
#
# Strangler stage A (ADR 0003) is OFF: config.dockLegacyImportConsumerGroup is
# left empty, and the chart then renders no DOCK_LEGACY_IMPORT_CONSUMER_GROUP
# (configmap.yaml and deployment.yaml wrap it in `with`), which is exactly the
# binary's "unset = off". Set a stable group id only while stage A runs.

replicaCount: 1

config:
  httpAddr: ":8080"
  logLevel: "info"
  # Fixed, stable group ids: a rescheduled pod resumes from its committed
  # offsets; a brand-new group re-reads the topic from the start. All four are
  # required (cmd/api exits at boot without them).
  # Consumes warehouse.yard-management.events.
  yardConsumerGroup: "dock-scheduling-yard"
  # Consumes warehouse.facility.events.
  facilityConsumerGroup: "dock-scheduling-facility"
  # Consumes warehouse.inbound-receiving.events (ASN).
  asnConsumerGroup: "dock-scheduling-asn"
  # Consumes warehouse.process-path-management.events (CPT).
  cptConsumerGroup: "dock-scheduling-cpt"
  # Strangler stage A importer: EMPTY = OFF (see the header).
  dockLegacyImportConsumerGroup: ""

database:
  existingSecret: dock-scheduling-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

extraEnv: []

# Kong exposure of the OLTP API (the chart's httproute.yaml):
# /api/dock-scheduling, prefix stripped. The parentRefs come from
# helm-values/_platform.yaml (the shared warehouse-gateway), never per-app.
# The reports route /api/dock-scheduling/reports is a longer prefix, which
# Gateway API matches first, so it needs no priority handling.
gatewayApi:
  enabled: true
  hosts:
    - path: /api/dock-scheduling
      pathType: PathPrefix
  stripPath: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/dock-scheduling

kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true

# Read-only MCP server (cmd/mcp), Service dock-scheduling-mcp:8090: Kong
# exposure /api/mcp/dock-scheduling, prefix rewritten to /mcp (the chart's
# mcp-route.yaml). No auth (the in-cluster ClusterIP boundary is the access
# control). The route's parentRefs come from _platform.yaml.
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/dock-scheduling

# Dedicated outbox relay (cmd/relay): redundant beside the api's inline relay,
# safe to run (see the header).
relay:
  enabled: true

service:
  port: 80
  targetPort: 8080
  type: ClusterIP

# Analytics read side (ADR 0006): the projector and the reports binaries of
# the SAME image, over a separate analytical Postgres database. The
# projector's consumer group is a FIXED, stable id (`<ctx>-analytics`): a
# restarted pod resumes from its committed offsets, and a brand-new group
# rebuilds the model from the topic's history. Equal to the chart's default,
# pinned here so a rename in code cannot silently orphan the committed offsets.
# The reports HTTPRoute is chart-rendered (/api/dock-scheduling/reports ->
# /reports); its parentRefs come from _platform.yaml.
analytics:
  enabled: true
  database:
    existingSecret: dock-scheduling-analytics-db
  projector:
    consumerGroup: "dock-scheduling-analytics"
  reports:
    route:
      enabled: true
      path: /api/dock-scheduling/reports

# No-show sweep (POST /no-show-sweeps every 5 minutes by CronJob): the chart's
# defaults apply, the target URL is the release's own api Service.
sweeps:
  enabled: true
