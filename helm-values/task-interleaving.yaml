# task-interleaving -- the task interleaving bounded context (WES: pairs
# station trips so an operator's outbound leg can carry a second task).
# OLTP REST on :8080 plus, in the SAME process, a transactional-outbox relay,
# a hint-expiry worker and two Kafka consumers (task-interleaving ADR 0003
# and ADR 0006):
#   - consumes warehouse.fulfillment.events (TaskAvailable, TaskClaimed,
#     TaskCompleted), group task-interleaving-fulfillment
#   - consumes warehouse.facility.events (layout copy), group
#     task-interleaving-layout
#   - produces warehouse.task-interleaving.events and
#     warehouse.task-interleaving.analytics (CloudEvents) through the outbox.
# Topics are auto-created by the first writer with the broker's
# num.partitions / replication-factor-1 overrides (ADR 0006 Amendment 1 in
# the service repo; kafka.tf has no topic resources -- the fleet norm), so the
# two topics above and the .dlq topics need no declaration here. A consumed
# topic whose producer has not written yet shows as consumer retry logs, not
# as unreadiness.
#
# Real Postgres and real Kafka only (ADR 0006): the *_MODE variables are
# intentionally NOT set. The binary defaults them to kafka and rejects
# "permissive" at boot, so there is nothing to wire and nothing to roll back.
# Every key below is a DEDICATED chart value (charts/task-interleaving/
# values.yaml renders each one to its env var), so none of this belongs in
# extraEnv (a duplicate env entry breaks ArgoCD's diff). The Kafka brokers
# (KAFKA_BROKERS) come from _platform.yaml, as for every chart.
#
# Startup: runs golang-migrate before serving, over MIGRATIONS_DATABASE_URL
# (the direct, non-pooled DSN Terraform puts in the <svc>-db Secret);
# DATABASE_URL itself goes through PgBouncer. The role/database are created
# by modules/application's provisioning Job (ADR 0005), before the first sync.
# HINT_EXPIRY_INTERVAL is left at the binary's default (5s).
#
# Optional components (all switched on below):
#   - MCP server (cmd/mcp, task-interleaving ADR 0007): mcp.enabled plus the
#     Kong route /api/mcp/task-interleaving (mcp.route).
#   - Analytics read side (ADR 0008): ti-projector (the only writer of the
#     SEPARATE task_interleaving_analytics database, fed by
#     warehouse.task-interleaving.analytics) and ti-reports (read-only, Service
#     task-interleaving-analytics-reports:80 -- the chart has no Kong route for
#     reports). The DSN never appears here: modules/application writes it into
#     the task-interleaving-analytics-db Secret (the chart reads only
#     ANALYTICS_DATABASE_URL, apps.yaml analytics.secret_keys), which
#     analytics.existingSecret names.
#   - The console remote (task_interleaving_mfe, web/): frontend below; its
#     content-addressed image tag comes from Terraform (local.frontend_remotes),
#     the web gateway serves it at /mfes/task-interleaving/.

replicaCount: 1

config:
  httpAddr: ":8080"
  logLevel: "info"
  # Fixed, stable group ids (the chart's own defaults, stated here so the
  # deployed names are visible in this repo): a rescheduled pod resumes from
  # its committed offsets; a brand-new group re-reads the topic from the
  # start. Both are required (the binary exits at boot without them).
  fulfillmentConsumerGroup: "task-interleaving-fulfillment"
  layoutConsumerGroup: "task-interleaving-layout"

# Analytics read side (ADR 0008). The projector's consumer group is a FIXED,
# stable id (fleet charter naming `<ctx>-analytics`): a restarted pod resumes
# from its committed offsets, and a brand-new group rebuilds the model from the
# topic's history. Equal to the chart's default, pinned here so a rename in code
# cannot silently orphan the committed offsets. MANDATORY when enabled (the
# chart refuses an empty one).
analytics:
  enabled: true
  consumerGroup: "task-interleaving-analytics"
  existingSecret: task-interleaving-analytics-db

# Platform facts (Gateway parentRefs, Kafka brokers, OTLP endpoint, CORS origin) come from
# _platform.yaml; image tags from Terraform (the Application's valuesObject).
database:
  existingSecret: task-interleaving-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/task-interleaving-frontend
gatewayApi:
  enabled: true
  hosts:
    - path: /api/task-interleaving
      pathType: PathPrefix
  stripPath: true
image:
  pullPolicy: IfNotPresent
  repository: warehouse/task-interleaving
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/task-interleaving
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/task-interleaving
a2a:
  enabled: true
  # cmd/a2a (task-interleaving's A2A inbound adapter ADR): delegation only; facts still travel as
  # CloudEvents on Kafka. Kong rewrites the path to / so the well-known agent card
  # stays reachable under the same prefix; parentRefs come from _platform.yaml.
  route:
    enabled: true
    path: /api/a2a/task-interleaving
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
