# kind CPU-request overlay for linehaul-transportation (single api container; generated
# from linehaul-transportation/charts/linehaul-transportation/values.yaml on develop). The local kind cluster
# is ONE worker with the Docker VM's 10 CPUs; chart defaults request
# 50-100m per container while real use is ~10% of that, so rolling
# updates (maxSurge 1 per Deployment) could not schedule. Only
# requests.cpu is lowered; limits and memory keep the chart defaults.
# The Application's last value file (ADR 0002 D2); Helm deep-merges it.
resources:
  requests:
    cpu: 25m

# Same treatment for the optional components that still requested the chart default of
# 100m while using 1-10m: the agent node has no CPU requests left and the server node no pod slot,
# so rollouts and new replicas stayed Pending. Requests only; limits and memory keep the chart defaults.
a2a:
  resources:
    requests:
      cpu: 25m
mcp:
  resources:
    requests:
      cpu: 25m
