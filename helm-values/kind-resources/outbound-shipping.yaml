# kind CPU-request overlay for outbound-shipping (derived from outbound-shipping/charts/outbound-shipping/values.yaml on develop).
# The Application's last value file (after _platform.yaml and <app>.yaml, ADR 0002 D2);
# modules/application requires it for every application and applies it on k3s too. Helm
# deep-merges it, so only requests.cpu changes: chart defaults request 100m per container
# while real use is ~10% of that, so rolling updates (maxSurge 1 per Deployment) could not
# schedule. Limits and memory keep the chart defaults.
mcp:
  resources:
    requests:
      cpu: 25m
resources:
  requests:
    cpu: 25m
