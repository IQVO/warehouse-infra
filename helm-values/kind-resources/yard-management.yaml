# kind CPU-request overlay for yard-management (derived from yard-management/charts/yard-management/values.yaml on develop).
# The Application's last value file (after _platform.yaml and <app>.yaml, ADR 0002 D2);
# modules/application requires it for every application and applies it on k3s too. Helm
# deep-merges it, so only requests.cpu changes: chart defaults request 100m per container
# while real use is ~10% of that, so rolling updates (maxSurge 1 per Deployment) could not
# schedule. Limits keep the chart defaults.
# Memory (capacity step 2, 2026-11-21): requests.memory = max(32Mi, 1.5 x the 24 h max working set
# measured on k3s, rounded up to 16Mi); limits keep the chart defaults unless noted. Values-only:
# ArgoCD rolls each touched Deployment when this file lands on develop.
analytics:
  projector:
    resources:
      requests:
        cpu: 25m
  reports:
    resources:
      requests:
        cpu: 25m
mcp:
  resources:
    requests:
      cpu: 25m
relay:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
resources:
  requests:
    cpu: 25m
    memory: 32Mi
