# kind CPU-request overlay for labor-performance (generated from labor-performance/charts/labor-performance/values.yaml on develop).
# The local kind cluster is ONE worker with the Docker VM's 10 CPUs; chart defaults request
# 50-100m per container (~10 cores for 76 app containers) while real use is ~10% of that, so
# rolling updates (maxSurge 1 per Deployment) could not schedule. Only requests.cpu is lowered;
# limits and memory keep the chart defaults. Merged INTO the Application's helm.valuesObject by
# terraform/kind-overlay.tf (ArgoCD ignores a helm.values string when valuesObject is set).
analytics:
  projector:
    resources:
      requests:
        cpu: 25m
  reports:
    resources:
      requests:
        cpu: 25m
frontend:
  resources:
    requests:
      cpu: 25m
mcp:
  resources:
    requests:
      cpu: 25m
resources:
  requests:
    cpu: 25m
