# kind CPU-request overlay for storefront-web (see customer-ordering for the rationale:
# one kind worker, chart defaults request 50-100m per container, real use is a
# fraction of that). Only requests.cpu is lowered; limits keep the
# chart defaults. The Application's last value file (ADR 0002 D2).
# Memory (capacity step 2, 2026-11-21): requests.memory = max(32Mi, 1.5 x the 24 h max working set
# measured on k3s, rounded up to 16Mi); limits keep the chart defaults unless noted. Values-only:
# ArgoCD rolls each touched Deployment when this file lands on develop.
resources:
  requests:
    cpu: 25m
    memory: 176Mi
