# kind CPU-request overlay for shipping-and-tracking (single api container; generated
# from shipping-and-tracking/charts/shipping-and-tracking/values.yaml on develop). The local kind cluster
# is ONE worker with the Docker VM's 10 CPUs; chart defaults request
# 50-100m per container while real use is ~10% of that, so rolling
# updates (maxSurge 1 per Deployment) could not schedule. Only
# requests.cpu is lowered; limits and memory keep the chart defaults.
# The Application's last value file (ADR 0002 D2); Helm deep-merges it.
resources:
  requests:
    cpu: 25m

# The analytics read side (reports, projector) gets the same treatment as the
# api: chart defaults request 100m while real use is a fraction.
analytics:
  reports:
    resources:
      requests:
        cpu: 25m
  projector:
    resources:
      requests:
        cpu: 25m
