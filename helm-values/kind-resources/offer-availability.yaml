# kind CPU-request overlay for offer-availability (single api container; generated
# from offer-availability/charts/offer-availability/values.yaml on develop). The local kind cluster
# is ONE worker with the Docker VM's 10 CPUs; chart defaults request
# 50-100m per container while real use is ~10% of that, so rolling
# updates (maxSurge 1 per Deployment) could not schedule. Only
# requests.cpu is lowered; limits keep the chart defaults.
# The Application's last value file (ADR 0002 D2); Helm deep-merges it.
# Memory (capacity step 2, 2026-11-21): requests.memory = max(32Mi, 1.5 x the 24 h max working set
# measured on k3s, rounded up to 16Mi); limits keep the chart defaults unless noted. Values-only:
# ArgoCD rolls each touched Deployment when this file lands on develop.
resources:
  requests:
    cpu: 25m
    memory: 32Mi

# Same treatment for the optional components that still requested the chart default of
# 100m while using 1-10m: the agent node has no CPU requests left and the server node no pod slot,
# so rollouts and new replicas stayed Pending. Requests only; limits keep the chart defaults.
a2a:
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
mcp:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
frontend:
  resources:
    requests:
      memory: 32Mi
