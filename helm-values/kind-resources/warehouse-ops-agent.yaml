# kind CPU-request overlay for warehouse-ops-agent (generated from warehouse-ops-agent/charts/warehouse-ops-agent/values.yaml on develop).
# The local kind cluster is ONE worker with the Docker VM's 10 CPUs; chart defaults request
# 50-100m per container (~10 cores for 76 app containers) while real use is ~10% of that, so
# rolling updates (maxSurge 1 per Deployment) could not schedule. Only requests.cpu is lowered;
# limits keep the chart defaults. The Application's last value file (after
# _platform.yaml and <app>.yaml, ADR 0002 D2); Helm deep-merges it, so only the requests set here change.
# Memory (capacity step 2, 2026-11-21): requests.memory = max(32Mi, 1.5 x the 24 h max working set
# measured on k3s, rounded up to 16Mi); limits keep the chart defaults unless noted. Values-only:
# ArgoCD rolls each touched Deployment when this file lands on develop.
resources:
  requests:
    cpu: 25m
    memory: 48Mi
