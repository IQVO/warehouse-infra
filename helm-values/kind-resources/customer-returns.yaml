# kind CPU-request overlay for customer-returns (single api container; generated
# from customer-returns/charts/customer-returns/values.yaml on develop). The
# local kind cluster is ONE worker with the Docker VM's 10 CPUs; chart defaults
# request 50-100m per container while real use is ~10% of that, so rolling
# updates (maxSurge 1 per Deployment) could not schedule. Only requests.cpu is
# lowered; limits and memory keep the chart defaults.
# The Application's last value file (ADR 0002 D2); Helm deep-merges it.
resources:
  requests:
    cpu: 25m
# The optional components (mcp, a2a) get the same treatment as the api: their
# chart defaults request 100m while real use is a fraction; the packed lab
# worker could not schedule them otherwise.
mcp:
  resources:
    requests:
      cpu: 25m
a2a:
  resources:
    requests:
      cpu: 25m
