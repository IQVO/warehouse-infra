# inbound-receiving -- the inbound receiving bounded context (ASN, dock
# appointment, receipt; inbound-receiving ADRs 0001-0006). OLTP REST on :8080
# plus, in the SAME process, a transactional-outbox relay and two Kafka
# local-copy consumers (ADR 0003):
#   - publishes warehouse.inbound-receiving.events (CloudEvents): ReceiptLineReceived
#     is what inventory-storage consumes to book StockReceived (inventory-storage
#     ADR 0037; wired in helm-values/inventory-storage.yaml in this same change).
#   - SKU copy       <- warehouse.product-master.events  (PRODUCT_MODE=kafka)
#   - inbound-door copy <- warehouse.facility.events     (DOCK_DOOR_MODE=kafka)
# Topics are auto-created by the first writer with the broker's num.partitions=8
# / replication-factor-1 overrides (kafka.tf has no topic resources -- the fleet
# norm, see network-inventory-planning.tf's header), so
# warehouse.inbound-receiving.events, warehouse.inbound-receiving.analytics and
# its .dlq need no declaration here.
#
# Every key below is a DEDICATED chart value (charts/inbound-receiving/values.yaml
# renders each one to its env var), so none of this belongs in extraEnv
# (a duplicate env entry breaks ArgoCD's diff).
#
# Startup: runs golang-migrate before serving, over MIGRATIONS_DATABASE_URL (the
# direct, non-pooled DSN Terraform puts in the <svc>-db Secret); DATABASE_URL
# itself goes through PgBouncer.
#
# MCP (inbound-receiving ADR 0005): read-only tools (mcp.enabled below); the
# ops-agent consumes it via the `inboundReceiving` upstream in
# warehouse-ops-agent.yaml.
#
# Analytics read side (inbound-receiving ADR 0006): inbound-projector (the only
# writer of the SEPARATE inbound_receiving_analytics database, admin :8091) and
# inbound-reports (read-only, :8092, Service inbound-receiving-reports, routed by
# Kong at /api/inbound-receiving/reports, analytics.reports.route below). Both
# ship in the SAME image as the api (one image build). The DSNs never appear
# here: modules/application writes them into the inbound-receiving-analytics-db
# Secret, which analytics.database.existingSecret names. The role/database are NOT created by a plain
# apply on an already-populated Postgres: see the infra PR runbook.
#
# The console remote (inbound_mfe, web/): frontend below; its content-addressed
# image tag comes from Terraform (local.frontend_remotes).

replicaCount: 1

config:
  httpAddr: ":8080"
  logLevel: "info"
  # Relay Inbound events onto warehouse.inbound-receiving.events (and the
  # analytics topic) instead of the log sink. Requires kafka.enabled (below);
  # the chart refuses to render otherwise.
  eventPublisher: "kafka"
  outboxRelayInterval: "1s"
  # ADR 0003 SKU local copy (fed from warehouse.product-master.events): an ASN
  # line for an unknown SKU is rejected at registration. A FIXED, stable group
  # id: a rescheduled pod resumes from its committed offsets; a brand-new group
  # starts at the earliest retained message and rebuilds the copy from history.
  # Required when productMode is "kafka" (the chart refuses an empty one).
  productMode: "kafka"
  productConsumerGroup: "inbound-receiving-product"
  # ADR 0003 inbound-door local copy (fed from warehouse.facility.events):
  # an appointment must book a known inbound-capable dock door. Spiked live
  # (2026-10-08, facility-layout REST GET /sites/{site}/locations?role=Dock):
  # 90 of 91 sites hold Dock slots, 1598 of them dockFlow=Inbound (the rest
  # Outbound), and facility-layout publishes to Kafka, so the copy has data to
  # enforce against. Stable group id, same reasoning as the product group.
  dockDoorMode: "kafka"
  dockDoorConsumerGroup: "inbound-receiving-dock-doors"

kafka:
  enabled: true
analytics:
  enabled: true
  projector:
    consumerGroup: "inbound-receiving-analytics"
  database:
    existingSecret: inbound-receiving-analytics-db
  reports:
    route:
      enabled: true
      path: /api/inbound-receiving/reports

# Formerly computed by terraform/services.tf (ADR 0002 phase 3, docs/adr/0002-application-delivery-boundary.md).
# Platform facts (Gateway parentRefs, Kafka brokers, OTLP endpoint, CORS origin) come from
# _platform.yaml; image tags from Terraform (the Application's valuesObject).
database:
  existingSecret: inbound-receiving-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/inbound-receiving-frontend
gatewayApi:
  enabled: true
  hosts:
    - path: /api/inbound-receiving
      pathType: PathPrefix
  stripPath: true
image:
  pullPolicy: IfNotPresent
  repository: warehouse/inbound-receiving
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/inbound-receiving
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/inbound-receiving
pathCatalogue:
  content: ''
  enabled: false
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
