# node-performance -- retail-network reference service (a domain-driven design
# study, not associated with any company). Single api Deployment: OLTP
# REST on :8080 plus, in the SAME process, a transactional-outbox relay
# and the local-copy consumers below. No analytics read side, no MCP
# server, no frontend remote.
#
# node-performance -- node-level operational performance (KPIs, score
# cards) recomputed from local copies of five sibling streams; consumes
# vendor-connectivity, shipping-and-tracking, delivery-promise,
# offer-availability and node-topology events, publishes
# retailnetwork.node-performance.events.
#
# Real Postgres and real Kafka only (the chart refuses a render without
# a database source and the brokers); topics are auto-created by the
# first writer (the fleet norm -- kafka.tf has no topic resources), so
# a consumed topic whose producer has not written yet shows as consumer
# retry logs, not as unreadiness. The brokers (KAFKA_BROKERS), the
# Gateway parentRefs, the CORS origin and the OTLP endpoint come from
# _platform.yaml; the image tag from Terraform (the Application's
# valuesObject); the CPU request from kind-resources/ (the kind
# overlay). Startup runs golang-migrate over MIGRATIONS_DATABASE_URL
# (the direct DSN Terraform puts in the node-performance-db Secret);
# DATABASE_URL goes through PgBouncer. The role and database are
# created by modules/application's provisioning Job (ADR 0005) before
# the first sync.

config:
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  vendorConnectivityConsumerGroup: "node-performance-vendor-connectivity"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  shippingAndTrackingConsumerGroup: "node-performance-shipping-and-tracking"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  deliveryPromiseConsumerGroup: "node-performance-delivery-promise"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  offerAvailabilityConsumerGroup: "node-performance-offer-availability"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  nodeTopologyConsumerGroup: "node-performance-node-topology"
  # seller-inbound InboundShipmentShipped -> the shipped instant of each inbound
  # shipment (ADR 0009). Fixed, stable group id. MANDATORY once the chart carrying
  # it is on develop; an older chart ignores the key.
  sellerInboundConsumerGroup: "node-performance-seller-inbound"

database:
  existingSecret: node-performance-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

# Kong exposure of the OLTP API (the chart's httproute.yaml):
# /api/node-performance, prefix stripped. The parentRefs come from
# helm-values/_platform.yaml (the shared warehouse-gateway), never per-app.
gatewayApi:
  enabled: true
  hosts:
    - path: /api/node-performance
      pathType: PathPrefix
  stripPath: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/node-performance

service:
  port: 80
  targetPort: 8080
  type: ClusterIP
