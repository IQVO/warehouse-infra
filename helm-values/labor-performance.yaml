# labor-performance — Labor Performance bounded context (engineered labor
# standards + actual-vs-standard scoring). Kafka CONSUMER of
# fulfillment-execution's TaskCompleted event (warehouse.fulfillment.events)
# AND, since its analytics data product (ADR-0007 there) and transactional
# outbox (ADR-0010 there), a PUBLISHER onto warehouse.labor-performance.analytics.
# EVENT_PUBLISHER is set by the chart itself (config.eventPublisher: "kafka"
# below) -- never via extraEnv, which would duplicate the chart's own rendered
# env and break ArgoCD's diff.
#
# Startup: runs migrations before serving.
#
# Kafka: kafka.enabled gates whether KAFKA_BROKERS is set in the container
# env at all. Unlike every OTHER service in this fleet, labor-performance's
# Kafka consumer is NOT cosmetic-on-failure: it is this service's ONLY
# inbound data path (a pure Kafka consumer of fulfillment-execution's
# TaskCompleted, per its own CLAUDE.md), and cmd/labor/main.go treats a
# consumer dial failure as FATAL (process exits), unlike
# fulfillment-execution's non-fatal background-goroutine failure. This MUST
# be enabled with a real, reachable broker or the pod crash-loops.

replicaCount: 1

config:
  httpAddr: ":8080"
  migrationsPath: "migrations"
  logLevel: "info"
  kafkaConsumerGroup: "labor-performance"
  corsAllowedOrigins: "http://localhost:5173,http://localhost:5187"

  eventPublisher: kafka
kafka:
  enabled: true
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6

# Formerly computed by terraform/services.tf (ADR 0002 phase 3, docs/adr/0002-application-delivery-boundary.md).
# Platform facts (Gateway parentRefs, Kafka brokers, OTLP endpoint, CORS origin) come from
# _platform.yaml; image tags from Terraform (the Application's valuesObject).
analytics:
  database:
    existingSecret: labor-performance-analytics-db
  enabled: true
  reports:
    route:
      enabled: true
      path: /api/labor-performance/reports
database:
  existingSecret: labor-performance-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/labor-performance-frontend
gatewayApi:
  enabled: true
  hosts:
    - path: /api/labor-performance
      pathType: PathPrefix
  stripPath: true
image:
  pullPolicy: IfNotPresent
  repository: warehouse/labor-performance
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/labor-performance
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/labor-performance
pathCatalogue:
  content: ''
  enabled: false
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
