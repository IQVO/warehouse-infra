# inventory-storage — Inventory & Storage bounded context.
#
# Startup: runs postgres.RunMigrations(DATABASE_URL, MIGRATIONS_PATH) before
# serving, so the pod is briefly unready on a cold database. The liveness probe
# below is relaxed accordingly (the chart default, 5s + 3 failures, can kill
# the pod mid-migration on a slow first boot).
#
# Kafka: live now that warehouse-infra runs a real Kafka release (kafka.tf).
#
# Analytics: the projector+reports pair (ADR-0010) is turned on here — see
# wes-work-planning.yaml's comment for the full rationale.

replicaCount: 1

config:
  httpAddr: ":8080"
  eventPublisher: "kafka"
  migrationsPath: "migrations"
  # Site-scoped transfer allocation command consumer (ADR-0030): consumes
  # network-inventory-planning's TransferAllocationRequested commands from
  # warehouse.network-inventory-planning.events. The chart natively
  # templates TRANSFER_ALLOCATION_CONSUMER_MODE/GROUP from these keys --
  # setting them via extraEnv would duplicate the chart's own env entries
  # and break ArgoCD's three-way diff (see locals.tf's sync_edge_env
  # header). The group id is the chart's own documented default, set
  # explicitly so the Deployment's env is self-describing; a locally-run
  # process overrides it so it can never steal the live Deployment's
  # partitions.
  transferAllocationConsumerMode: "kafka"
  transferAllocationConsumerGroup: "inventory-storage-transfer-allocation"
  # product-master classification local copy (inventory-storage ADR-0034;
  # product-master ADR 0003 stage D): consume ProductClassified from
  # warehouse.product-master.events into product_classifications. A DEDICATED
  # chart value (rendered to PRODUCT_MASTER_CONSUMER_GROUP), so it lives here and
  # never in extraEnv. A fixed, stable id: a restarted pod resumes from its
  # committed offsets. Empty would leave the consumer off.
  productMasterConsumerGroup: "inventory-storage-product-master"
  # inbound-receiving handover (inventory-storage ADR-0037): consume
  # ReceiptLineReceived from warehouse.inbound-receiving.events and book every
  # condition=Good line as a staged receipt (StockReceived).
  # A DEDICATED chart value (rendered to the inbound-receipt consumer group env
  # var), so it lives here and never in extraEnv. A fixed, stable id: a
  # restarted pod resumes from its committed offsets. Empty would leave the
  # consumer off. StockReceived leaves the service through the outbox relay,
  # which needs config.eventPublisher=kafka (set above).
  inboundReceiptConsumerGroup: "inventory-storage-inbound-receipts"

kafka:
  enabled: true
  brokers: "kafka.warehouse-systems.svc.cluster.local:9092"

analytics:
  enabled: true

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6
