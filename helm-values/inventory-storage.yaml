# inventory-storage — Inventory & Storage bounded context.
#
# Startup: runs postgres.RunMigrations(DATABASE_URL, MIGRATIONS_PATH) before
# serving, so the pod is briefly unready on a cold database. The liveness probe
# below is relaxed accordingly (the chart default, 5s + 3 failures, can kill
# the pod mid-migration on a slow first boot).
#
# Kafka: live now that warehouse-infra runs a real Kafka release (kafka.tf).
#
# Analytics: the projector+reports pair (ADR-0010) is turned on here — see
# wes-work-planning.yaml's comment for the full rationale.

replicaCount: 1

config:
  httpAddr: ":8080"
  eventPublisher: "kafka"
  migrationsPath: "migrations"

kafka:
  enabled: true
  brokers: "kafka.warehouse-systems.svc.cluster.local:9092"

analytics:
  enabled: true

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6
