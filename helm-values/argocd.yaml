# Local single-node kind cluster values for the argo/argo-cd chart.
#
# Two deliberate departures from chart defaults, both decided explicitly
# with the user rather than left as chart defaults (see
# docs/plans or the argocd-gitops-rollout plan for the full rationale):
#
# 1. Auth is disabled (configs.params."server.disable.auth": true). Every
#    other REST/MCP endpoint in this fleet is already unauthenticated
#    (fleet-wide auth was rolled out then fully reverted 2026-09-11); the
#    user explicitly chose to keep ArgoCD consistent with that posture
#    rather than carve out an exception for the deployment control plane.
# 2. No Ingress/Route of any kind. ArgoCD is deliberately NOT exposed
#    through either of the fleet's two host-facing edges (Nginx :80 for the
#    product UI, Kong :8000 for product APIs) -- both are reserved for
#    product traffic per docs/exposure/localhost-edge-topology.md. Local
#    admin access is via `kubectl port-forward svc/argocd-server -n argocd
#    8080:443` only.
#
# Everything below this is single-replica because this is a laptop kind
# cluster, not an HA concern.

redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  replicas: 1
  # Probes (kind, 2026-10-14): the chart's 1s timeout on /healthz?full=true
  # failed chronically under load (argocd-server: 98 liveness failures in 16h;
  # repo-server: killed 23x in 5h, exit 137) and, when a terraform apply made
  # all 16 Applications re-render at once (helm template ~14s, git fetch ~32s,
  # GenerateManifest ~78s), the repo-server entered a liveness-kill loop and
  # every Application went "Unknown" (connection refused on :8081). The process
  # was healthy, only slow to answer: give the probe a realistic budget.
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
    periodSeconds: 15
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  service:
    type: ClusterIP
  # Kept on TLS (server.insecure stays false) -- port-forwarding to a TLS
  # listener works fine locally and disabling TLS entirely is unrelated to
  # the auth decision above.
  ingress:
    enabled: false

repoServer:
  replicas: 1
  # Probes (kind, 2026-10-14): the chart's 1s timeout on /healthz?full=true
  # failed chronically under load (argocd-server: 98 liveness failures in 16h;
  # repo-server: killed 23x in 5h, exit 137) and, when a terraform apply made
  # all 16 Applications re-render at once (helm template ~14s, git fetch ~32s,
  # GenerateManifest ~78s), the repo-server entered a liveness-kill loop and
  # every Application went "Unknown" (connection refused on :8081). The process
  # was healthy, only slow to answer: give the probe a realistic budget.
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
    periodSeconds: 15
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6

applicationSet:
  enabled: true
  replicas: 1

configs:
  params:
    # Bound concurrent `helm template` renders in the repo-server (chart
    # default 0 = unlimited): 16 charts rendering at once on the single kind
    # worker is what pushed the repo-server past its probe budget. Excess
    # requests queue instead of all slowing down together.
    reposerver.parallelism.limit: 4
    server.disable.auth: true
