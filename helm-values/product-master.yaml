# product-master -- the product master data bounded context (SKU identity,
# declared/measured dimensions, handling classification; product-master ADRs
# 0001-0004). OLTP REST on :8080 plus, in the SAME process, a
# transactional-outbox relay and (ADR 0003) the legacy classification importer:
#   - publishes warehouse.product-master.events (CloudEvents, key = SKU):
#     ProductRegistered, ProductDescriptionChanged, ProductDimensionsDeclared,
#     ProductMeasured and ProductClassified -- the last is what the four
#     classification readers keep local copies of (ADR 0003 stage D:
#     inventory-storage, order-management, wes-work-planning,
#     fulfillment-execution; wired in this same change).
#   - legacy importer <- warehouse.inventory.events (inventory-storage's legacy
#     classification events, migrated into product-master's own store).
# Topics are auto-created by the first writer with the broker's num.partitions=8
# / replication-factor-1 overrides (kafka.tf has no topic resources -- the fleet
# norm, see network-inventory-planning.tf's header), so
# warehouse.product-master.events, warehouse.product-master.analytics and its
# .dlq need no declaration here.
#
# Every key below is a DEDICATED chart value (charts/product-master/values.yaml
# renders each one to its env var), so none of this belongs in
# local.sync_edge_env -- an `extraEnv` in THIS file would be silently dropped by
# the computed layer (see helm-values/_README.md and terraform/locals.tf).
#
# Startup: runs golang-migrate before serving, over MIGRATIONS_DATABASE_URL (the
# direct, non-pooled DSN Terraform puts in the <svc>-db Secret); DATABASE_URL
# itself goes through PgBouncer.
#
# MCP (product-master ADR 0005): read-only tools, enabled by services.tf's
# `contains(local.mcp_services, name)` gate; the ops-agent consumes it via the
# `productMaster` upstream in ops-agent.tf.
#
# Analytics read side (product-master ADR 0006): product-projector (the only
# writer of the SEPARATE product_master_analytics database, admin :8091) and
# product-reports (read-only, :8092, Service product-master-reports, routed by
# Kong at /api/product-master/reports by services.tf like every sibling). Both
# ship in the SAME image as the api (one build_and_load). The DSNs
# (analytics.database.projectorUrl/reportsUrl) are computed by Terraform
# (services.tf, from local.analytics_services) and merged over this block, so
# only the static bits live here. The role/database are NOT created by a plain
# apply on an already-populated Postgres: see the infra PR runbook.
#
# The console remote (productmaster_mfe, web/) is NOT set here:
# terraform/services.tf computes `frontend` (enabled + content-addressed image
# tag) for every context in local.frontend_remotes, and a `frontend:` key in
# this file would be overridden.

replicaCount: 1

config:
  httpAddr: ":8080"
  logLevel: "info"
  # Relay Product events onto warehouse.product-master.events (and the analytics
  # topic) instead of the log sink. Requires kafka.enabled (below); the chart
  # refuses to render otherwise.
  eventPublisher: "kafka"
  outboxRelayInterval: "1s"
  # ADR 0003 legacy classification importer (reads warehouse.inventory.events).
  # A FIXED, stable id: a rescheduled pod resumes from its committed offsets; a
  # brand-new group starts at the earliest retained message, so the first
  # rollout imports the whole legacy history (deduped on the CloudEvents id).
  # Empty would switch the importer OFF.
  legacyImportConsumerGroup: "product-master-legacy-import"

kafka:
  enabled: true
  brokers: "kafka.warehouse-systems.svc.cluster.local:9092"

# Analytics read side (ADR 0006). `enabled` is also set by Terraform's computed
# layer (services.tf, contains(local.analytics_services, name)); repeated here so
# this file is the readable source of truth, exactly as the siblings do. The
# projector's consumer group (ANALYTICS_CONSUMER_GROUP) is a FIXED, stable id
# (fleet charter naming `<ctx>-analytics`), pinned equal to the chart's default
# so a rename there cannot silently orphan the committed offsets. The DSNs come
# from the computed layer (database.projectorUrl / reportsUrl), shallow-merged
# over this block (disjoint keys).
analytics:
  enabled: true
  projector:
    consumerGroup: "product-master-analytics"
