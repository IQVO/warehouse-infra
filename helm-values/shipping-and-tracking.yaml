# shipping-and-tracking -- retail-network reference service (a domain-driven design
# study, not associated with any company). Single api Deployment: OLTP
# REST on :8080 plus, in the SAME process, a transactional-outbox relay
# and the local-copy consumers below. Still no analytics read side, but
# a read-only MCP server (cmd/mcp) and a console remote (web/, shipping_mfe)
# now exist and are switched on below.
#
# shipping-and-tracking -- the shipping catalog + tracking timeline:
# consumes vendor, linehaul, lastmile and catalog streams, publishes
# retailnetwork.shipping-and-tracking.events. Reads customer-ordering
# synchronously over REST (customerOrderingUrl). The ship-to snapshot
# is ALWAYS encrypted: SHIP_TO_ENCRYPTION_KEY (base64 of 32 bytes) and
# STOP_KEY_SECRET come from the shipping-and-tracking-crypto Secret
# that Terraform generates (random_id/random_password in
# terraform/20-apps/main.tf) -- no key ever reaches this public repo.
#
# Real Postgres and real Kafka only (the chart refuses a render without
# a database source and the brokers); topics are auto-created by the
# first writer (the fleet norm -- kafka.tf has no topic resources), so
# a consumed topic whose producer has not written yet shows as consumer
# retry logs, not as unreadiness. The brokers (KAFKA_BROKERS), the
# Gateway parentRefs, the CORS origin and the OTLP endpoint come from
# _platform.yaml; the image tag from Terraform (the Application's
# valuesObject); the CPU request from kind-resources/ (the kind
# overlay). Startup runs golang-migrate over MIGRATIONS_DATABASE_URL
# (the direct DSN Terraform puts in the shipping-and-tracking-db Secret);
# DATABASE_URL goes through PgBouncer. The role and database are
# created by modules/application's provisioning Job (ADR 0005) before
# the first sync.

config:
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  vendorConsumerGroup: "shipping-and-tracking-vendor"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  linehaulConsumerGroup: "shipping-and-tracking-linehaul"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  lastmileConsumerGroup: "shipping-and-tracking-lastmile"
  # fixed, stable group id: a rescheduled pod resumes from its
  # committed offsets; a brand-new group would re-read the topic
  # from the start. MANDATORY (the binary exits at boot without it).
  catalogConsumerGroup: "shipping-and-tracking-catalog"
  # synchronous REST call into the sibling; MANDATORY.
  customerOrderingUrl: "http://customer-ordering.warehouse-systems.svc.cluster.local:80"

# The encryption material never appears here (this repo is public):
# Terraform generates it into the shipping-and-tracking-crypto
# Secret (random_id for the 32-byte ship-to key, random_password for
# the stop-key HMAC secret).
crypto:
  existingSecret: shipping-and-tracking-crypto

database:
  existingSecret: shipping-and-tracking-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

# The console remote (shipping_mfe, web/): its content-addressed image tag
# comes from Terraform (local.frontend_remotes); the web gateway
# serves it at /mfes/shipping-and-tracking/.
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/shipping-and-tracking-frontend

# Kong exposure of the OLTP API (the chart's httproute.yaml):
# /api/shipping-and-tracking, prefix stripped. The parentRefs come from
# helm-values/_platform.yaml (the shared warehouse-gateway), never per-app.
gatewayApi:
  enabled: true
  hosts:
    - path: /api/shipping-and-tracking
      pathType: PathPrefix
  stripPath: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/shipping-and-tracking

# Read-only MCP server (cmd/mcp), Service shipping-and-tracking-mcp:8090:
# Kong exposure /api/mcp/shipping-and-tracking, prefix rewritten to /mcp
# (the chart's mcp-route.yaml). The route's parentRefs come from
# _platform.yaml exactly like the OLTP route above.
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/shipping-and-tracking
a2a:
  enabled: true
  # A2A inbound adapter (see the repo's A2A ADR): delegation only; facts still travel as
  # CloudEvents on Kafka. Kong rewrites the path to / so the well-known agent card
  # stays reachable under the same prefix; parentRefs come from _platform.yaml.
  route:
    enabled: true
    path: /api/a2a/shipping-and-tracking

service:
  port: 80
  targetPort: 8080
  type: ClusterIP
