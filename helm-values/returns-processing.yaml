# returns-processing -- the returns processing bounded context (WMS: return
# authorization, receipt, inspection, disposition). OLTP REST on :8080 plus,
# in the SAME process, a transactional-outbox relay and three Kafka
# local-copy consumers (returns-processing ADR 0001):
#   - consumes warehouse.product-master.events (ProductClassified), group
#     returns-processing-product-classification
#   - consumes warehouse.order-management.events (OrderAllocated,
#     OrderPartiallyAllocated, OrderRepromised), group
#     returns-processing-order-lines
#   - consumes warehouse.fulfillment.events (PackageManifested), group
#     returns-processing-manifest
#   - produces warehouse.returns-processing.events and
#     warehouse.returns-processing.analytics (CloudEvents) through the
#     outbox. inventory-storage consumes ReturnLineStaged (the RESTOCK
#     disposition's handover, config.returnLineConsumerGroup in
#     helm-values/inventory-storage.yaml) and exception-management consumes
#     the integration topic (RETURNS_EXCEPTIONS_CONSUMER_GROUP,
#     helm-values/exception-management.yaml).
# Topics are auto-created by the first writer with the broker's
# num.partitions / replication-factor-1 overrides (the fleet norm; kafka.tf
# has no topic resources), so the two topics above and the .dlq topics need
# no declaration here. A consumed topic whose producer has not written yet
# shows as consumer retry logs, not as unreadiness.
#
# Real Postgres and real Kafka only: the *_MODE variables are intentionally
# NOT set and this chart refuses one in extraEnv at render time. Every key
# below is a DEDICATED chart value (charts/returns-processing/values.yaml
# renders each one to its env var), so none of this belongs in extraEnv
# (a duplicate env entry breaks ArgoCD's diff). The Kafka brokers
# (KAFKA_BROKERS) come from _platform.yaml, as for every chart.
#
# Startup: runs golang-migrate before serving, over MIGRATIONS_DATABASE_URL
# (the direct, non-pooled DSN Terraform puts in the <svc>-db Secret);
# DATABASE_URL itself goes through PgBouncer. The role/database are created
# by modules/application's provisioning Job (ADR 0005), before the first
# sync.
#
# Optional components (both switched on below):
#   - MCP server (cmd/mcp, read-only: get_return, list_returns_by_order,
#     get_disposition_policy): mcp.enabled. This chart renders no Kong route
#     for it (unlike pick-face-replenishment's mcp.route) -- the Service
#     returns-processing-mcp:8090 stays ClusterIP and warehouse-ops-agent
#     reaches it in-cluster.
#   - Analytics read side: returns-projector (the only writer of the
#     SEPARATE returns_processing_analytics database, fed by
#     warehouse.returns-processing.analytics) and returns-reports (read-only,
#     Service returns-processing-reports:80 -- the chart has no Kong route
#     for reports). The DSN never appears here: modules/application writes it
#     into the returns-processing-analytics-db Secret (the chart reads only
#     ANALYTICS_DATABASE_URL, apps.yaml analytics.secret_keys), which
#     analytics.existingSecret names.
#   - The console remote (returns_mfe, web/): frontend below; its
#     content-addressed image tag comes from Terraform (local.frontend_remotes),
#     the web gateway serves it at /mfes/returns-processing/.

replicaCount: 1

config:
  httpAddr: ":8080"
  logLevel: "info"
  # OUTBOX_*: stated at the chart's own defaults so the deployment is
  # self-describing (the relay claims pending rows every 1s; a row that
  # failed 20 times is excluded so a poison row cannot block the relay).
  outboxRelayInterval: "1s"
  outboxMaxAttempts: 20
  # Fixed, stable group ids (the chart's own defaults, stated here so the
  # deployed names are visible in this repo): a rescheduled pod resumes from
  # its committed offsets; a brand-new group re-reads the topic from the
  # start. All three are required (the binary exits at boot without them).
  productClassificationConsumerGroup: "returns-processing-product-classification"
  orderLinesConsumerGroup: "returns-processing-order-lines"
  manifestConsumerGroup: "returns-processing-manifest"

# Analytics read side. The projector's consumer group is a FIXED, stable id
# (fleet charter naming `<ctx>-analytics`): a restarted pod resumes from its
# committed offsets, and a brand-new group rebuilds the model from the
# topic's history. Equal to the chart's default, pinned here so a rename in
# code cannot silently orphan the committed offsets. MANDATORY when enabled
# (the chart refuses an empty one).
analytics:
  enabled: true
  consumerGroup: "returns-processing-analytics"
  existingSecret: returns-processing-analytics-db

# Platform facts (Gateway parentRefs, Kafka brokers, OTLP endpoint, CORS origin) come from
# _platform.yaml; image tags from Terraform (the Application's valuesObject).
database:
  existingSecret: returns-processing-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/returns-processing-frontend
image:
  pullPolicy: IfNotPresent
  repository: warehouse/returns-processing
mcp:
  enabled: true
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
