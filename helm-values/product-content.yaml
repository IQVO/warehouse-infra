# product-content -- storefront domain catalog content. Single api Deployment:
# OLTP REST :8080 + outbox relay + the offer-availability consumer. Real
# Postgres and real Kafka only; brokers/parentRefs/CORS/OTLP from
# _platform.yaml; image tag from Terraform; CPU from kind-resources/.
# Migrations run at boot over MIGRATIONS_DATABASE_URL from the
# product-content-db Secret (role created by the provisioning Job, ADR 0005).

config:
  # fixed, stable group id: a rescheduled pod resumes from its committed
  # offsets. MANDATORY (the binary exits at boot without it).
  offerAvailabilityConsumerGroup: "product-content-offer-availability"
database:
  existingSecret: product-content-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

gatewayApi:
  enabled: true
  hosts:
    - path: /api/product-content
      pathType: PathPrefix
  stripPath: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/product-content

service:
  port: 80
  targetPort: 8080
  type: ClusterIP
mcp:
  # Read-only L1 MCP server (cmd/mcp, the service's MCP ADR). No auth, by the fleet decision.
  # The route is /api/mcp/product-content; Kong rewrites it to /mcp. Requests are sized in
  # helm-values/kind-resources/product-content.yaml (the cluster has no spare CPU or pod slot at the chart default).
  enabled: true
  route:
    enabled: true
    path: /api/mcp/product-content
a2a:
  enabled: true
  # A2A inbound adapter (see the repo's A2A ADR): delegation only; facts still travel as
  # CloudEvents on Kafka. Kong rewrites the path to / so the well-known agent card
  # stays reachable under the same prefix; parentRefs come from _platform.yaml.
  route:
    enabled: true
    path: /api/a2a/product-content

# Capacity step 3: cmd/mcp and cmd/a2a run as the two containers of one <release>-agents
# Deployment (chart's agents.colocate). The Services -mcp/-a2a keep their names and ports but
# select the agents pod; the standalone Deployments are pruned (PruneLast) after it serves.
agents:
  colocate: true
# Kong plugins (cors, prometheus, opentelemetry) rendered by the chart's kong-plugins.yaml and attached to
# every route by annotation (fleet decision 2026-10-13). The CORS origin and the OTLP endpoint come from
# _platform.yaml.
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
