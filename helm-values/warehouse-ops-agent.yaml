# warehouse-ops-agent: complete Helm values (ADR 0002 D2), formerly computed in
# terraform/20-apps/main.tf (see its git history for each block's reasoning).

# The image (repository, tag, pullPolicy) is NOT here: Terraform sets it in the
# Application's valuesObject from var.ops_agent_image_repository/var.ops_agent_image_tag,
# which the operator overrides locally in terraform.tfvars.
# The Anthropic API key is never a value: credentials.existingSecret points at the
# warehouse-ops-agent-anthropic Secret Terraform creates (modules/application `secrets`).
# llm.mode "shadow" needs that key; terraform/20-apps/main.tf's check block warns when it is
# empty.
credentials:
  existingSecret: warehouse-ops-agent-anthropic
# The two new bounded contexts' MCP servers, pre-wired for the
# returns/exceptions rollout: the ops-agent chart (on develop) has a
# dedicated upstreams value per context it already knows, but not yet one
# for returns-processing (cmd/mcp: get_return, list_returns_by_order,
# get_disposition_policy) or exception-management (cmd/mcp:
# list_open_exceptions, get_exception, get_exception_policies,
# get_sla_report). Until that repo grows the two clients, the env names land
# here through extraEnv -- the skill's prescribed channel for env the chart
# does not render (the chart renders no RETURNS_PROCESSING_MCP_ENDPOINT /
# EXCEPTION_MANAGEMENT_MCP_ENDPOINT of its own, so there is no duplicate
# env entry and ArgoCD's three-way diff is safe). The Go binary ignores
# unknown env names, so this is inert until the clients ship.
extraEnv:
  - name: RETURNS_PROCESSING_MCP_ENDPOINT
    value: http://returns-processing-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  - name: EXCEPTION_MANAGEMENT_MCP_ENDPOINT
    value: http://exception-management-mcp.warehouse-systems.svc.cluster.local:8090/mcp
gatewayApi:
  enabled: true
  hosts:
    - path: /api/warehouse-ops-agent
      pathType: PathPrefix
  stripPath: true
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/warehouse-ops-agent
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
llm:
  mode: shadow
prometheus:
  url: http://prometheus-server.observability.svc.cluster.local:9090
reportsUrls:
  facilityLayout: http://facility-layout-reports.warehouse-systems.svc.cluster.local:80
  fulfillmentExecution: http://fulfillment-execution-reports.warehouse-systems.svc.cluster.local:80
  inventoryStorage: http://inventory-storage-reports.warehouse-systems.svc.cluster.local:80
  laborPerformance: http://labor-performance-reports.warehouse-systems.svc.cluster.local:80
  orderManagement: http://order-management-reports.warehouse-systems.svc.cluster.local:80
  wesWorkPlanning: http://wes-work-planning-reports.warehouse-systems.svc.cluster.local:80
  workforceManagement: http://workforce-management-reports.warehouse-systems.svc.cluster.local:80
restUrls:
  fulfillmentExecution: http://fulfillment-execution.warehouse-systems.svc.cluster.local:80
  inventoryStorage: http://inventory-storage.warehouse-systems.svc.cluster.local:80
  orderManagement: http://order-management.warehouse-systems.svc.cluster.local:80
  wesWorkPlanning: http://wes-work-planning.warehouse-systems.svc.cluster.local:80
runtimeSignals:
  lokiUrl: http://loki.observability.svc.cluster.local:3100
service:
  port: 80
  targetPort: 8095
  type: ClusterIP
upstreams:
  facilityLayout:
    endpoint: http://facility-layout-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  fulfillmentExecution:
    endpoint: http://fulfillment-execution-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  inboundReceiving:
    endpoint: http://inbound-receiving-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  inventoryStorage:
    endpoint: http://inventory-storage-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  laborPerformance:
    endpoint: http://labor-performance-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  networkInventoryPlanning:
    endpoint: http://network-inventory-planning-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  orderManagement:
    endpoint: http://order-management-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  processPathManagement:
    endpoint: http://process-path-management-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  productMaster:
    endpoint: http://product-master-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  slottingOptimization:
    endpoint: http://slotting-optimization-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  warehousePlanning:
