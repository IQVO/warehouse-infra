name: Cluster acceptance

# Never triggered from a pull request: a clean-cluster provision (ArgoCD, Kong, Istio,
# Kafka, Postgres, observability, the whole fleet) does not fit a shared
# 2-core runner's time budget -- the ArgoCD chart alone outran a 20-minute
# helm timeout twice. The PR gate is the fast acceptance-units job in
# ci.yml; the full acceptance runs scheduled and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fleet_shas:
        description: >-
          Exact JSON map of every fleet repository to a 40-character commit SHA.
          Leave {} for a develop-head snapshot; release gates must pass the full map.
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

concurrency:
  group: cluster-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  clean-cluster:
    name: clean-cluster platform and exposure
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_FLEET_SHAS: ${{ inputs.fleet_shas || '{}' }}
      CLUSTER_ACCEPTANCE_ARTIFACT_DIR: ${{ github.workspace }}/warehouse-infra/artifacts/cluster-acceptance
    steps:
      - name: Checkout warehouse-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(inputs.fleet_shas || '{}')['warehouse-infra'] || github.event.pull_request.head.sha || github.sha }}
          path: warehouse-infra
      # The fleet is whatever terraform/apps.yaml registers (plus the
      # non-registration repositories the acceptance run consumes) -- derived
      # at run time, so a newly registered context can never be missed here
      # again. Refs: the fleet_shas input when given, else the repo's
      # default branch (main once released, develop until then).
      - name: Check out the whole fleet (derived from terraform/apps.yaml)
        working-directory: warehouse-infra
        env:
          FLEET_SHAS: ${{ inputs.fleet_shas || '{}' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, yaml
          from pathlib import Path
          shas = json.loads(os.environ.get("FLEET_SHAS") or "{}")
          apps = yaml.safe_load(Path("terraform/apps.yaml").read_text())["applications"]
          repos = sorted(apps) + ["warehouse-console", "warehouse-ui-kit", "warehouse-docs", "e2e-tests"]
          for repo in repos:
              if repo == "warehouse-infra":
                  continue  # checked out by the action above, at the PR head
              if Path(f"../{repo}").exists():
                  print("already present:", repo)
                  continue
              url = f"https://x-access-token:{os.environ['GITHUB_TOKEN']}@github.com/IQVO/{repo}.git"
              ref = shas.get(repo)
              if not ref:
                  heads = subprocess.run(["git", "ls-remote", "--heads", url, "main"], capture_output=True, text=True)
                  ref = "main" if heads.stdout.strip() else "develop"
              subprocess.run(["git", "clone", "--depth=1", "--branch", ref, url, f"../{repo}"], check=True)
          print("checked out:", " ".join(repos))
          PY

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.31.4
      - name: Install kind only
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.26.0
          install_only: true
      - name: Set up Go for the official MCP SDK probe
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: warehouse-infra/scripts/mcp-probe/go.sum

      - name: Unit and static acceptance checks
        working-directory: warehouse-infra
        run: |
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/*.sh
          (cd scripts/mcp-probe && go test ./...)
        env:
          GOWORK: "off"
      - name: Verify exact clean fleet snapshot before provisioning
        working-directory: warehouse-infra
        run: |
          mkdir -p artifacts/cluster-acceptance
          python3 scripts/write_fleet_shas.py \
            --infra-root "$PWD" \
            --workspace "${{ github.workspace }}" \
            --output artifacts/cluster-acceptance/fleet-shas-preflight.json \
            --require-clean \
            --expected-json "$EXPECTED_FLEET_SHAS"
      - name: Provision an owned clean cluster and run acceptance
        working-directory: warehouse-infra
        run: scripts/run-cluster-acceptance.sh --provision
      - name: Publish exact tested fleet SHAs in job summary
        if: ${{ always() }}
        working-directory: warehouse-infra
        run: |
          if [[ -f artifacts/cluster-acceptance/fleet-shas.json ]]; then
            {
              echo '## Exact fleet snapshot'
              echo '```json'
              python3 -m json.tool artifacts/cluster-acceptance/fleet-shas.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload cluster acceptance diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-acceptance-${{ github.run_id }}
          path: warehouse-infra/artifacts/cluster-acceptance
          if-no-files-found: warn
          retention-days: 14
